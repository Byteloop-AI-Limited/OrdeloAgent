<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Demo Kitchen</title>
<!-- Official Telegram bridge: defines window.Telegram.WebApp. Must be loaded for the page to talk to Telegram. -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Telegram injects --tg-theme-* CSS variables matching the user's chat theme (light/dark/custom). Fallbacks are for plain browsers. */
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #707579);
    --link: var(--tg-theme-link-color, #2481cc);
    --btn: var(--tg-theme-button-color, #2481cc);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --card: var(--tg-theme-secondary-bg-color, #f1f3f5);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
         padding: 16px 16px 96px; }
  h1 { font-size: 1.35rem; margin: 0 0 2px; }
  h2 { font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; color: var(--hint); margin: 22px 0 8px; font-weight: 600; }
  .sub { color: var(--hint); margin: 0 0 12px; font-size: .92rem; }
  .card { background: var(--card); border-radius: 12px; padding: 12px 14px; margin: 8px 0; }
  .row { display: flex; align-items: center; gap: 12px; }
  .grow { flex: 1; min-width: 0; }
  .emoji { font-size: 1.8rem; }
  .name { font-weight: 600; } .desc { color: var(--hint); font-size: .85rem; } .price { font-variant-numeric: tabular-nums; }
  .qty { display: flex; align-items: center; gap: 10px; }
  .qty button, .btn { border: 0; border-radius: 10px; background: var(--btn); color: var(--btn-text); font: inherit; cursor: pointer; }
  .qty button { width: 34px; height: 34px; font-size: 1.2rem; line-height: 1; }
  .qty button:disabled { opacity: .35; }
  .qty span { min-width: 1.2em; text-align: center; font-variant-numeric: tabular-nums; }
  .btn { padding: 12px 16px; width: 100%; margin-top: 12px; }
  .btn.ghost { background: transparent; color: var(--link); }
  .status { display: flex; gap: 6px; margin: 10px 0 2px; }
  .step { flex: 1; text-align: center; padding: 8px 2px; border-radius: 8px; background: var(--card); color: var(--hint); font-size: .85rem; }
  .step.on { background: var(--btn); color: var(--btn-text); font-weight: 600; }
  .warn { background: #fff3cd; color: #664d03; border-radius: 10px; padding: 10px 12px; margin: 10px 0; font-size: .9rem; }
  .err { color: #d93025; margin: 8px 0; }
  table { width: 100%; border-collapse: collapse; font-size: .88rem; }
  td { padding: 5px 0; vertical-align: top; } td:first-child { color: var(--hint); width: 42%; }
  .tag { display: inline-block; font-size: .7rem; padding: 1px 7px; border-radius: 99px; background: #fde7e9; color: #b3261e; margin-left: 6px; }
  .tag.ok { background: #dcf5e4; color: #1b6b3a; }
  .hidden { display: none; }
</style>
</head>
<body>
<div id="app"></div>

<script>
"use strict";
const tg = window.Telegram && window.Telegram.WebApp;
const inTelegram = !!(tg && tg.initData);           // empty when opened in a normal browser
const $app = document.getElementById("app");
const money = (p) => "£" + (p / 100).toFixed(2);
const state = { menu: [], cart: {}, view: "menu", order: null, session: null, poll: null, busy: false };

// Tiny DOM helper. Everything user-controlled goes through textContent, never innerHTML (no XSS from a display name).
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return el;
}

// Every API call carries Telegram's signed initData. The server verifies the signature and takes the user id from it.
async function api(path, opts = {}) {
  const res = await fetch("/miniapp/api" + path, {
    ...opts,
    headers: { "Content-Type": "application/json", "X-Telegram-Init-Data": tg ? tg.initData : "" },
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.detail || res.statusText);
  return body;
}

const haptic = (kind, type) => { try { tg.HapticFeedback[kind](type); } catch (e) {} };
const cartLines = () => Object.entries(state.cart).filter(([, q]) => q > 0).map(([id, qty]) => ({ id, qty }));
const cartTotal = () => cartLines().reduce((s, l) => s + state.menu.find((m) => m.id === l.id).price * l.qty, 0); // DISPLAY only; the server re-prices
const cartCount = () => cartLines().reduce((s, l) => s + l.qty, 0);

function setQty(id, delta) {
  const q = Math.max(0, Math.min(10, (state.cart[id] || 0) + delta));
  state.cart[id] = q;
  haptic("impactOccurred", "light");
  render();
}

// ---- Telegram chrome: MainButton (bottom bar) and BackButton (header) -------------------------------------------
function syncButtons() {
  if (!tg) return;
  if (state.view === "menu" && cartCount() > 0) {
    tg.MainButton.setText(`Checkout · ${money(cartTotal())}`);
    tg.MainButton.show();
    tg.MainButton.onClick(checkout);   // re-registered each render, so clear first (see render())
  } else {
    tg.MainButton.hide();
  }
  state.view === "order" ? tg.BackButton.show() : tg.BackButton.hide();
}

function checkout() {
  if (state.busy) return;
  const go = async (ok) => {
    if (!ok) return;
    state.busy = true; tg.MainButton.showProgress();
    try {
      // idempotency_key: a double tap / retry returns the SAME order instead of creating a second one
      const key = state.pendingKey || (state.pendingKey = crypto.randomUUID());
      const r = await api("/orders", { method: "POST", body: JSON.stringify({ items: cartLines(), idempotency_key: key }) });
      state.pendingKey = null; state.cart = {};
      haptic("notificationOccurred", "success");
      showOrder(r.order);
    } catch (e) {
      haptic("notificationOccurred", "error");
      tg.showAlert("Could not place order: " + e.message);
    } finally { state.busy = false; tg.MainButton.hideProgress(); }
  };
  tg.showConfirm(`Place this order for ${money(cartTotal())}?`, go);
}

// ---- views -------------------------------------------------------------------------------------------------------
function menuView() {
  return [
    h("h1", {}, "🍽 Demo Kitchen"),
    h("p", { class: "sub" }, state.session ? `Hi ${state.session.user.first_name}, pick something tasty.` : "Pick something tasty."),
    ...state.menu.map((m) => {
      const q = state.cart[m.id] || 0;
      return h("div", { class: "card row" },
        h("div", { class: "emoji" }, m.emoji),
        h("div", { class: "grow" }, h("div", { class: "name" }, m.name), h("div", { class: "desc" }, m.desc)),
        h("div", { class: "price" }, money(m.price)),
        h("div", { class: "qty" },
          h("button", { "aria-label": "Remove one " + m.name, disabled: q === 0, onclick: () => setQty(m.id, -1) }, "−"),
          h("span", {}, q),
          h("button", { "aria-label": "Add one " + m.name, disabled: q >= 10, onclick: () => setQty(m.id, +1) }, "+")));
    }),
    !tg ? h("div", { class: "warn" }, "Browser preview: ordering needs Telegram's signed data. Open this from the bot.") : null,
    infoView(),
  ];
}

function orderView() {
  const o = state.order; const steps = ["placed", "preparing", "ready"]; const at = steps.indexOf(o.status);
  return [
    h("h1", {}, "Order " + o.id),
    h("p", { class: "sub" }, "Status updates automatically (demo timer)."),
    h("div", { class: "status" }, steps.map((s, i) => h("div", { class: "step" + (i <= at ? " on" : "") }, s))),
    h("h2", {}, "Items"),
    ...o.items.map((it) => h("div", { class: "card row" },
      h("div", { class: "grow" }, `${it.qty} × ${it.name}`), h("div", { class: "price" }, money(it.line_total)))),
    h("div", { class: "card row" }, h("div", { class: "grow name" }, "Total"), h("div", { class: "price name" }, money(o.total))),
    h("p", { class: "sub" }, "The total above was calculated by the server, not by this page."),
    h("button", { class: "btn ghost", onclick: backToMenu }, "← Back to menu"),
  ];
}

// What Telegram gave the page, and which parts can be trusted.
function infoView() {
  const unsafe = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
  const verified = state.session && state.session.user;
  const row = (k, v, tag) => h("tr", {}, h("td", {}, k), h("td", {}, v == null ? "-" : String(v), tag || null));
  return h("details", { class: "card" },
    h("summary", {}, "What Telegram gave this page"),
    h("h2", {}, "Client-side (unverified)"),
    h("table", {}, row("user", unsafe ? `${unsafe.first_name} (id ${unsafe.id})` : "(none)", h("span", { class: "tag" }, "anyone can fake")),
      row("platform", tg && tg.platform), row("version", tg && tg.version), row("colorScheme", tg && tg.colorScheme)),
    h("h2", {}, "Server-verified (HMAC checked)"),
    h("table", {}, verified
      ? [row("user", `${verified.first_name} (id ${verified.id})`, h("span", { class: "tag ok" }, "trusted")),
         row("username", verified.username), row("initData age", state.session.auth_age_seconds + "s"),
         row("Ordelo link", state.session.ordelo_link ? `${state.session.ordelo_link.phone}${state.session.ordelo_link.phone_verified ? " ✔" : ""}` : "not linked")]
      : row("status", "no verified session")));
}

function render() {
  if (tg) { tg.MainButton.offClick(checkout); }
  $app.replaceChildren(...(state.view === "order" ? orderView() : menuView()).filter(Boolean));
  syncButtons();
}

function backToMenu() { clearInterval(state.poll); state.view = "menu"; state.order = null; render(); }

function showOrder(order) {
  state.order = order; state.view = "order"; render();
  clearInterval(state.poll);
  state.poll = setInterval(async () => {
    try {
      const fresh = await api("/orders/" + encodeURIComponent(order.id));
      const changed = fresh.status !== state.order.status;
      state.order = fresh;
      if (changed) { haptic("impactOccurred", "medium"); render(); }
      if (fresh.status === "ready") clearInterval(state.poll);
    } catch (e) { clearInterval(state.poll); }
  }, 3000);
}

async function start() {
  if (tg) {
    tg.ready();            // tell Telegram the page is loaded (hides its splash)
    tg.expand();           // use the full height
    tg.BackButton.onClick(backToMenu);
    tg.onEvent("themeChanged", () => {});   // CSS variables update on their own; hook here if you need JS-side colours
  }
  render();
  if (!inTelegram) return;
  try {
    [state.menu, state.session] = await Promise.all([api("/menu"), api("/session")]);
    const wanted = new URLSearchParams(location.search).get("order");   // deep link from the bot's "Track order" button
    if (wanted) { try { return showOrder(await api("/orders/" + encodeURIComponent(wanted))); } catch (e) {} }
    render();
  } catch (e) {
    $app.replaceChildren(h("h1", {}, "🍽 Demo Kitchen"), h("p", { class: "err" }, "Could not load: " + e.message));
  }
}
start();
</script>
</body>
</html>
