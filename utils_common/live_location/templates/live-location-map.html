<!DOCTYPE html>
<html>
<head>
    <title>Live Location Tracking</title>
    <style>
        #map {
            height: 100%;
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <script>
        async function initMap() {
            // Hardcoded location points
            const locations = [
                { lat: 51.353698, lng: 0.098156, timestamp: "2025-02-06 08:53:40" },
                { lat: 51.35999, lng: 0.091425, timestamp: "2025-02-06 08:56:40" },
                { lat: 51.35971, lng: 0.094352, timestamp: "2025-02-06 09:02:09" },
                { lat: 51.359635, lng: 0.097427, timestamp: "2025-02-06 09:02:25" },
                { lat: 51.359339, lng: 0.100694, timestamp: "2025-02-06 09:02:46" },
                { lat: 51.358904, lng: 0.101528, timestamp: "2025-02-06 09:02:53" },
                { lat: 51.356972, lng: 0.102766, timestamp: "2025-02-06 09:03:27" },
                { lat: 51.355149, lng: 0.101984, timestamp: "2025-02-06 09:04:09" },
                { lat: 51.354126, lng: 0.099301, timestamp: "2025-02-06 09:04:33" },
                { lat: 51.353098, lng: 0.096583, timestamp: "2025-02-06 09:04:54" },
                { lat: 51.354081, lng: 0.095992, timestamp: "2025-02-06 09:05:53" },
                { lat: 51.354294, lng: 0.096047, timestamp: "2025-02-06 09:08:53" }
            ];
            
            // Calculate the center of all points
            const bounds = new google.maps.LatLngBounds();
            const points = locations.map(loc => {
                const point = new google.maps.LatLng(loc.lat, loc.lng);
                bounds.extend(point);
                return point;
            });

            // Create the map centered on the points
            const map = new google.maps.Map(document.getElementById('map'), {
                zoom: 14,
                mapTypeId: google.maps.MapTypeId.ROADMAP
            });

            // Fit the map to show all points
            map.fitBounds(bounds);

            // Create DirectionsService object to use the route method
            const directionsService = new google.maps.DirectionsService();
            
            // Create a DirectionsRenderer object to display the route
            const directionsRenderer = new google.maps.DirectionsRenderer({
                suppressMarkers: true, // We'll create our own markers
                preserveViewport: true
            });
            directionsRenderer.setMap(map);

            // Function to create a promise-based directions request
            const getRouteSegment = (start, end) => {
                return new Promise((resolve, reject) => {
                    directionsService.route({
                        origin: start,
                        destination: end,
                        travelMode: google.maps.TravelMode.DRIVING
                    }, (result, status) => {
                        if (status === google.maps.DirectionsStatus.OK) {
                            resolve(result);
                        } else {
                            reject(status);
                        }
                    });
                });
            };

            // Draw routes between consecutive points
            for (let i = 0; i < locations.length - 1; i++) {
                try {
                    const start = new google.maps.LatLng(locations[i].lat, locations[i].lng);
                    const end = new google.maps.LatLng(locations[i + 1].lat, locations[i + 1].lng);
                    
                    const result = await getRouteSegment(start, end);
                    const routeRenderer = new google.maps.DirectionsRenderer({
                        map: map,
                        directions: result,
                        suppressMarkers: true,
                        preserveViewport: true,
                        polylineOptions: {
                            strokeColor: '#FF0000',
                            strokeOpacity: 1.0,
                            strokeWeight: 2
                        }
                    });
                } catch (error) {
                    console.error('Direction request failed:', error);
                }
            }

            // Add bike marker only for the last point
            const lastLocation = locations[locations.length - 1];
            const lastMarker = new google.maps.Marker({
                position: { lat: lastLocation.lat, lng: lastLocation.lng },
                map: map,
                icon: {
                    url: "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(`
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="32" height="32">
                            <circle cx="12" cy="12" r="11" fill="#25D366"/>
                            <path fill="white" d="M16 8a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM6 15a3 3 0 1 0 0 6 3 3 0 0 0 0-6zm0 4a1 1 0 1 1 0-2 1 1 0 0 1 0 2zm12-4a3 3 0 1 0 0 6 3 3 0 0 0 0-6zm0 4a1 1 0 1 1 0-2 1 1 0 0 1 0 2zm-6-7l2-2 .7.7c1.3 1.3 3 2.1 4.8 2.1v-2c-1.5 0-2.7-.6-3.6-1.5l-1.9-1.9c-.5-.4-1-.6-1.6-.6s-1.1.2-1.4.6L8 10.4c-.4.4-.6.9-.6 1.4 0 .6.2 1.1.6 1.4L11 16v3h2v-4.2l-1-1z"/>
                        </svg>
                    `),
                    scaledSize: new google.maps.Size(40, 40), 
                    anchor: new google.maps.Point(20, 20)
                }
            });
        }
    </script>
    <!-- Replace YOUR_API_KEY with your actual Google Maps API key -->
    <script async defer
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAJPDr2WJvb6aertgRmLdFBYKWxSG_ceQE&callback=initMap">
    </script>
</body>
</html>
