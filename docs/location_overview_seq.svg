<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="420" viewBox="0 0 1040 420" role="img" aria-label="Location transition sequence">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f4b99"/>
    </marker>
    <marker id="arrow-dash" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5b73"/>
    </marker>
    <style>
      text{font-family:Arial,sans-serif;font-size:12px;fill:#0b1f33;}
      .lifeline{stroke:#9bb3d9;stroke-dasharray:4 4;}
      .arrow{stroke:#1f4b99;stroke-width:1.6;fill:none;marker-end:url(#arrow);}
      .arrow-dash{stroke:#4b5b73;stroke-width:1.2;fill:none;stroke-dasharray:5 4;marker-end:url(#arrow-dash);}
      .label{font-size:11px;}
    </style>
  </defs>

  <!-- Participant headers -->
  <text x="80" y="30" text-anchor="middle">OwnTracks</text>
  <text x="220" y="30" text-anchor="middle">PGMQ 'owntracks'</text>
  <text x="360" y="30" text-anchor="middle">job_process_owntracks()</text>
  <text x="500" y="30" text-anchor="middle">rider_location_event</text>
  <text x="640" y="30" text-anchor="middle">rider_location_event_update</text>
  <text x="780" y="30" text-anchor="middle">/location-hooks/notify-rider-location-event</text>
  <text x="920" y="30" text-anchor="middle">Restaurant webhook</text>

  <!-- Lifelines -->
  <line class="lifeline" x1="80" y1="40" x2="80" y2="400"/>
  <line class="lifeline" x1="220" y1="40" x2="220" y2="400"/>
  <line class="lifeline" x1="360" y1="40" x2="360" y2="400"/>
  <line class="lifeline" x1="500" y1="40" x2="500" y2="400"/>
  <line class="lifeline" x1="640" y1="40" x2="640" y2="400"/>
  <line class="lifeline" x1="780" y1="40" x2="780" y2="400"/>
  <line class="lifeline" x1="920" y1="40" x2="920" y2="400"/>

  <!-- Messages -->
  <line class="arrow" x1="80" y1="80" x2="220" y2="80"/>
  <text class="label" x="150" y="68" text-anchor="middle">publish location/transition</text>

  <line class="arrow" x1="360" y1="120" x2="220" y2="120"/>
  <text class="label" x="290" y="108" text-anchor="middle">read batch</text>

  <line class="arrow" x1="360" y1="160" x2="500" y2="160"/>
  <text class="label" x="430" y="148" text-anchor="middle">INSERT transition rows</text>

  <line class="arrow" x1="500" y1="200" x2="640" y2="200"/>
  <text class="label" x="570" y="188" text-anchor="middle">AFTER INSERT trigger</text>

  <line class="arrow" x1="640" y1="240" x2="780" y2="240"/>
  <text class="label" x="710" y="228" text-anchor="middle">http_post payload=row_to_json(NEW)</text>

  <line class="arrow" x1="780" y1="280" x2="920" y2="280"/>
  <text class="label" x="850" y="268" text-anchor="middle">POST delivery_summary (rider-rest-enter | rider-cust-enter)</text>

  <line class="arrow-dash" x1="920" y1="320" x2="780" y2="320"/>
  <text class="label" x="850" y="308" text-anchor="middle">response ignored by DB trigger</text>
</svg>
