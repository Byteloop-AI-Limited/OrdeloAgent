<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ordelo &#8646; Frontend Explorer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f172a;color:#e2e8f0;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{padding:10px 14px;background:#1e293b;border-bottom:1px solid #334155;display:flex;align-items:center;gap:14px;flex-shrink:0;flex-wrap:wrap}
header h1{font-size:14px;font-weight:700;color:#f8fafc;white-space:nowrap}
header .sub{font-size:11px;color:#64748b;white-space:nowrap}
#tabs{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.tab{padding:4px 11px;border-radius:4px;cursor:pointer;font-size:11px;border:1px solid #475569;color:#94a3b8;background:transparent;transition:all .15s;font-family:inherit}
.tab:hover{background:#334155;color:#e2e8f0}
.tab.active{background:#3b82f6;color:#fff;border-color:#3b82f6}
.tab.special{border-color:#f59e0b;color:#fbbf24}
.tab.special.active{background:#f59e0b;color:#0f172a;border-color:#f59e0b}
#main{flex:1;display:flex;overflow:hidden;min-height:0}
#sidebar{width:228px;flex-shrink:0;background:#1e293b;border-right:1px solid #334155;overflow-y:auto;padding:11px;display:flex;flex-direction:column;gap:12px}
.sec-title{font-size:10px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.layer-row{display:flex;align-items:center;gap:7px;cursor:pointer;padding:3px 0;user-select:none}
.layer-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.layer-row span{font-size:11.5px;color:#cbd5e1;transition:opacity .1s}
.layer-row.off span{opacity:.35;text-decoration:line-through}
.subview{padding:5px 8px;border-radius:4px;cursor:pointer;font-size:11.5px;color:#94a3b8;border:1px solid transparent;margin-bottom:3px}
.subview:hover{background:#334155;color:#e2e8f0}
.subview.active{background:#1e3a5f;color:#93c5fd;border-color:#3b82f6}
.gotcha{background:#431407;border:1px solid #9a3412;border-radius:5px;padding:7px 9px;margin-bottom:6px;cursor:pointer;transition:background .15s}
.gotcha:hover,.gotcha.hl{background:#7c2d12;border-color:#ea580c}
.gtitle{font-size:11px;font-weight:700;color:#fb923c}
.gdesc{font-size:11px;color:#fed7aa;margin-top:2px;line-height:1.45}
#canvas-wrap{flex:1;position:relative;overflow:hidden;background:#0f172a;display:flex;flex-direction:column;min-width:0}
svg#diagram{width:100%;height:100%;cursor:grab;display:block}
svg#diagram.panning{cursor:grabbing}
#zoom-btns{position:absolute;bottom:12px;right:12px;display:flex;flex-direction:column;gap:3px;z-index:5}
.zbtn{width:26px;height:26px;background:#1e293b;border:1px solid #334155;color:#94a3b8;border-radius:4px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;user-select:none}
.zbtn:hover{background:#334155;color:#e2e8f0}
#detail{width:0;flex-shrink:0;background:#1e293b;border-left:1px solid #334155;padding:0;overflow:hidden;transition:width .2s,padding .2s}
#detail.open{width:310px;padding:12px;overflow-y:auto}
#det-close{float:right;cursor:pointer;color:#64748b;font-size:16px;line-height:1}
#det-close:hover{color:#e2e8f0}
#det-title{font-size:13.5px;font-weight:700;color:#f1f5f9;margin-bottom:3px;clear:both;line-height:1.35}
#det-sub{font-size:11px;color:#64748b;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;margin-bottom:8px;word-break:break-all}
.badge{display:inline-block;padding:2px 7px;border-radius:10px;font-size:9.5px;font-weight:700;margin:0 4px 8px 0;letter-spacing:.02em}
.ds{margin-bottom:10px}
.dst{font-size:9.5px;font-weight:700;color:#64748b;text-transform:uppercase;margin-bottom:4px;letter-spacing:.05em}
.dsp{font-size:11.5px;color:#cbd5e1;line-height:1.6}
.dsc{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;background:#0f172a;border:1px solid #334155;border-radius:3px;padding:6px 8px;color:#a5f3fc;display:block;margin-top:4px;word-break:break-all;white-space:pre-wrap;line-height:1.5}
.dsg{background:#431407;border:1px solid #9a3412;border-radius:4px;padding:7px 9px;font-size:11px;color:#fed7aa;line-height:1.5;margin-top:6px}
.src{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;color:#94a3b8;background:#0f172a;border:1px solid #334155;border-radius:3px;padding:4px 7px;margin-top:3px;display:block;word-break:break-all}
.src b{color:#7dd3fc;font-weight:400}
#pane{flex:1;overflow-y:auto;padding:16px 20px;min-width:0}
#pane h2{font-size:16px;color:#f8fafc;margin-bottom:5px;font-weight:700}
#pane h3{font-size:13px;color:#e2e8f0;margin:18px 0 7px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#pane p.lead{font-size:12.5px;color:#94a3b8;line-height:1.65;margin-bottom:12px;max-width:80ch}
#filters{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.fbtn{padding:4px 10px;border-radius:4px;cursor:pointer;font-size:11px;border:1px solid #475569;color:#94a3b8;background:transparent;font-family:inherit}
.fbtn:hover{background:#334155;color:#e2e8f0}
.fbtn.active{background:#334155;color:#f1f5f9;border-color:#64748b}
#search{padding:4px 9px;border-radius:4px;border:1px solid #475569;background:#0f172a;color:#e2e8f0;font-size:11px;font-family:inherit;min-width:190px}
#search:focus{outline:none;border-color:#3b82f6}
.ep{border:1px solid #334155;border-radius:5px;margin-bottom:5px;background:#1e293b;overflow:hidden}
.ep-head{padding:7px 10px;cursor:pointer;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.ep-head:hover{background:#26364d}
.meth{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:3px;flex-shrink:0;min-width:42px;text-align:center}
.m-GET{background:#064e3b;color:#6ee7b7}.m-POST{background:#1e3a5f;color:#93c5fd}
.m-PATCH{background:#422006;color:#fcd34d}.m-RPC{background:#3b0764;color:#d8b4fe}
.m-SQL{background:#422006;color:#fdba74}.m-WA{background:#14532d;color:#86efac}
.ep-path{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:#e2e8f0;flex:1;min-width:180px;word-break:break-all}
.ep-tag{font-size:9.5px;padding:2px 7px;border-radius:9px;font-weight:700;flex-shrink:0}
.t-live{background:#052e16;color:#4ade80;border:1px solid #166534}
.t-dead{background:#450a0a;color:#f87171;border:1px solid #7f1d1d}
.t-stale{background:#422006;color:#fbbf24;border:1px solid #92400e}
.ep-body{display:none;padding:2px 10px 11px;border-top:1px solid #334155}
.ep.open .ep-body{display:block}
.ep-grid{display:grid;grid-template-columns:78px 1fr;gap:5px 11px;font-size:11.5px;margin-top:9px}
.ep-grid dt{color:#64748b;font-size:10px;text-transform:uppercase;font-weight:700;padding-top:3px;letter-spacing:.04em}
.ep-grid dd{color:#cbd5e1;line-height:1.55;min-width:0}
.chip{display:inline-block;font-size:10.5px;color:#94a3b8;background:#0f172a;border:1px solid #334155;border-radius:3px;padding:2px 6px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;margin:2px 3px 0 0}
.card{background:#1e293b;border:1px solid #334155;border-radius:6px;padding:12px 14px;margin-bottom:9px}
.card.red{border-left:3px solid #ef4444}
.card.amber{border-left:3px solid #f59e0b}
.card.green{border-left:3px solid #22c55e}
.card h4{font-size:12.5px;color:#f1f5f9;margin-bottom:5px;font-weight:700}
.card p{font-size:11.5px;color:#cbd5e1;line-height:1.65;margin-bottom:5px}
.note{background:#0c2a4d;border:1px solid #1e40af;border-radius:5px;padding:10px 12px;font-size:11.5px;color:#bfdbfe;line-height:1.65;margin:10px 0;max-width:82ch}
.note b{color:#dbeafe}
#prompt-bar{background:#1e293b;border-top:1px solid #334155;padding:9px 12px;flex-shrink:0;display:flex;gap:10px;align-items:flex-start;max-height:96px}
#prompt-text{flex:1;font-size:11px;color:#94a3b8;line-height:1.6;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow-y:auto;max-height:76px}
#copy-btn{padding:5px 13px;background:#1e3a5f;border:1px solid #3b82f6;color:#93c5fd;border-radius:4px;cursor:pointer;font-size:11px;flex-shrink:0;font-family:inherit}
#copy-btn:hover{background:#1e40af}
.hop{cursor:pointer}
.hop:hover rect.hitbox{fill:#ffffff12}
.hop.sel rect.hitbox{fill:#3b82f61f}
@media(max-width:900px){#sidebar{display:none}#detail.open{width:250px}}
</style>
</head>
<body>
<header>
  <h1>Ordelo &#8646; Restaurant-Frontend</h1>
  <span class="sub">interaction explorer &#183; generated from code on dev</span>
  <div id="tabs">
    <button class="tab active" data-tab="flows">Flows</button>
    <button class="tab" data-tab="endpoints">Endpoints</button>
    <button class="tab" data-tab="portals">Portals</button>
    <button class="tab" data-tab="data">Identity &amp; Data</button>
    <button class="tab special" data-tab="gaps">&#9888; Web-only gaps</button>
  </div>
</header>
<div id="main">
  <aside id="sidebar"><div id="sidebar-content"></div></aside>
  <div id="canvas-wrap">
    <svg id="diagram" style="display:none"><g id="svg-root"></g></svg>
    <div id="zoom-btns" style="display:none">
      <div class="zbtn" id="zin" title="Zoom in">+</div>
      <div class="zbtn" id="zreset" title="Reset view">&#9673;</div>
      <div class="zbtn" id="zout" title="Zoom out">&#8722;</div>
    </div>
    <div id="pane"></div>
  </div>
  <aside id="detail">
    <span id="det-close">&#10005;</span>
    <div id="det-title">&#8212;</div>
    <div id="det-sub">&#8212;</div>
    <div id="det-body"></div>
  </aside>
</div>
<div id="prompt-bar">
  <div id="prompt-text">Pick a flow on the left, or click any hop in the diagram to see its payload and source lines.</div>
  <button id="copy-btn">Copy</button>
</div>
<script>
/* ============================================================
   DATA — every field below is transcribed from source on dev.
   Citations are file:line. See the "Verify" note in Identity tab.
   ============================================================ */

const ACTORS = {
  browser: {label:'Browser',       sub:'customer device',        x:0,  color:'#a78bfa'},
  next:    {label:'Next /api',     sub:'restaurant-frontend',    x:1,  color:'#60a5fa'},
  ordelo:  {label:'ORDELO',        sub:'FastAPI + LangGraph',    x:2,  color:'#34d399'},
  rest:    {label:'restaurant-agents', sub:'restaurant runtime', x:3,  color:'#fbbf24'},
  ext:     {label:'External',      sub:'Stripe / Google / DB',   x:4,  color:'#f472b6'}
};

const LAYERS = {
  http:  {label:'Frontend → ORDELO', color:'#60a5fa'},
  proxy: {label:'ORDELO ↔ restaurant-agents', color:'#fbbf24'},
  db:    {label:'DB trigger / RPC', color:'#c084fc'},
  ext:   {label:'Stripe / pricing / maps', color:'#f472b6'},
  wa:    {label:'WhatsApp-only hop', color:'#4ade80'},
  dead:  {label:'Dead end / not built', color:'#ef4444'}
};

const FLOWS = {
order: { title:'Order &amp; Payment (delivery)', blurb:
  'The full path from a WhatsApp menu link to a <code>delivery_summary</code> row. Note hop 6: session validation is a <b>reverse-proxy</b> — ORDELO does not own the session store. And note the last hop: after paying, the customer gets nothing back.',
  hops:[
 {f:'ext',t:'browser',l:'menu link (WhatsApp)',layer:'wa',
  code:'{RESTAURANT_MENU_APP_URL}/restaurant/elas\n  ?minimum_order=12.24\n  &order_type=delivery\n  &thread_id=ELAS-7d4aa595-...\n  &recipient=447448440754',
  d:'ORDELO resolves the base URL via get_restaurant_base_url_async("RESTAURANT_MENU") and sends the link over WABA. The pair (recipient, thread_id) IS the customer session — there is no cookie and no session id.',
  src:[['watomation/fapp_ordelo_agent.py','258'],['restaurant-frontend/curl-tests.sh','35']],
  g:'recipient and minimum_order are display-only strings from the URL (app/restaurant/[id]/page.tsx:26-29). The authoritative delivery fee comes back later from create-order.'},

 {f:'browser',t:'next',l:'GET /api/menu',layer:'http',
  code:'GET /api/menu?restaurant=elas',
  d:'Menu fetch. This does NOT go to ORDELO — it proxies to the separate byteloop menu service.',
  src:[['restaurant-frontend/app/api/menu/route.ts','49']]},

 {f:'next',t:'ext',l:'GET {MENU_API_URL}',layer:'ext',
  code:'GET https://restaurant.byteloop.ai/api/menu\n      ?restaurant_name={apiName}',
  d:'Separate service, unrelated to ORDELO. apiName can differ from the ordering ref — e.g. wren serves elas’s menu but orders under its own orderApiName.',
  src:[['restaurant-frontend/app/api/menu/route.ts','81'],['restaurant-frontend/CLAUDE.md','29']]},

 {f:'browser',t:'next',l:'GET /api/verify-session',layer:'http',
  code:'GET /api/verify-session?rest_ref=ELAS&recipient=447448440754',
  d:'Fired twice: once on page load, and again immediately before checkout inside the basket drawer.',
  src:[['restaurant-frontend/app/restaurant/[id]/page.tsx','52'],['restaurant-frontend/components/BasketDrawer.tsx','82']]},

 {f:'next',t:'ordelo',l:'GET /order-hooks/get-active-thread',layer:'http',
  code:'GET {ORDELO}/order-hooks/get-active-thread/{rest_ref}/{recipient}',
  d:'Resolved base URL comes from Supabase ordelo_config.ORDELO_APP_URL (60s TTL cache), falling back to the RIDER_AGENT_URL env var.',
  src:[['restaurant-frontend/app/api/verify-session/route.ts','20'],['restaurant-frontend/lib/config.ts','24'],['watomation/routers/order_hooks.py','393']]},

 {f:'ordelo',t:'rest',l:'↳ proxied verbatim',layer:'proxy',
  code:'GET {REST_APP_URL}/thread-hooks/get-active-thread/{rest_ref}/{recipient}\n\n→ { thread_id: "ELAS-7d4a..." }   or   -1  (no active thread)',
  d:'THE KEY STRUCTURAL FACT. ORDELO is a pure reverse-proxy here — it returns the upstream body and status unchanged (502 on transport error). The session lives in the restaurant runtime, not in ORDELO.',
  src:[['watomation/routers/order_hooks.py','400'],['config/params.py','66']],
  g:'Validation is plaintext equality: thread_id !== -1 && thread_id === urlThreadId. No HMAC, no signature, no cookie. Anyone who knows a (recipient, thread_id) pair can order.'},

 {f:'browser',t:'next',l:'POST /api/checkout',layer:'http',
  code:'{ restaurantId, recipient, threadId,\n  orderItems:[{order_id,sku,quantity,price,product_name,modifications}],\n  notes?, orderType }',
  d:'Prices in order_items are already discounted client-side before they are sent.',
  src:[['restaurant-frontend/app/api/checkout/route.ts','5'],['restaurant-frontend/components/BasketDrawer.tsx','106']]},

 {f:'next',t:'ordelo',l:'POST /order-hooks/create-order',layer:'http',
  code:'POST {ORDELO}/order-hooks/create-order/{rest_ref}\n\n{ recipient, thread_id, order_items[], order_type, notes? }',
  d:'rest_ref = restaurantConfig.orderApiName ?? apiName. This single call does three jobs: order-number creation, delivery pricing, and payment-page provisioning.',
  src:[['restaurant-frontend/app/api/checkout/route.ts','52'],['watomation/routers/order_hooks.py','212']]},

 {f:'ordelo',t:'ext',l:'order number + pricing',layer:'db',
  code:'RPC get_next_daily_seq(order_date)\ncreate_order_reference(recipient, order_dt)\n\norder_id     = "KDDV-21"\norder_number = "ELAS-KDDV-21"   ← {REST_REF}-{ref}-{seq}',
  d:'The 4-char reference is a salted SHA-256 of the LAST 4 DIGITS OF THE PHONE NUMBER. food_order is inserted with payment_status = requires_payment.',
  src:[['utils_common/order_management/order_service.py','213'],['utils_common/order_management/order_db_ops_new.py','63']],
  g:'HARD BLOCKER for a web-only channel: create_order_reference raises ValueError unless recipient[-4:] is 4 digits. A web user without a phone number fails here, before any row is written.'},

 {f:'ordelo',t:'ext',l:'POST {pricing_url}',layer:'ext',
  code:'{ total_food_value, restaurant_latitude, restaurant_longitude,\n  customer_latitude, customer_longitude, rest_ref, order_number }\n\n→ delivery_options[] where vehicle_type == "car"\n   → service_charge, delivery_fee, small_order_fee, commission_rate',
  d:'The pricing microservice. Channel-agnostic — fully reusable by a web-only channel as-is.',
  src:[['utils_common/order_management/food_order_pymodel.py','55'],['config/microservices_setting.py','29']]},

 {f:'ordelo',t:'ext',l:'POST …/payment-url (Stripe)',layer:'ext',
  code:'POST {stripe_url}/threads/{thread_id}/orders/{order_id}/payment-url\nX-Authorization: Bearer {stripe_token}\n\ndelivery → manual capture   (captured later, at rider assignment)',
  d:'Overwatch (test) customers are routed to stripe_url_test instead. Returns a hosted Checkout url.',
  src:[['utils_common/payment_ms/payment.py','26'],['utils_common/order_management/food_order_pymodel.py','192']]},

 {f:'ordelo',t:'next',l:'200 ← payment_intent_url',layer:'http',
  code:'{ status, order_id, recipient, thread_id, order_number,\n  payment_intent_url, service_charge, delivery_fee,\n  small_order_fee, notes }',
  d:'This is the complete response. Nothing else is returned.',
  src:[['watomation/routers/order_hooks.py','292']],
  g:'CONTRACT DRIFT: the frontend reads data.subtotal and data.total, which ORDELO never sends — both are always undefined. BasketDrawer falls through to client-recomputed pricing, so the total the customer sees is computed in the browser.'},

 {f:'browser',t:'ext',l:'redirect → Stripe Checkout',layer:'ext',
  code:'window.location.href = orderData.payment_intent_url',
  d:'Full off-site redirect. sessionStorage["order_summary"] is deliberately kept so the customer can come back.',
  src:[['restaurant-frontend/app/order-summary/page.tsx','97']]},

 {f:'ext',t:'rest',l:'Stripe success → payment MS',layer:'ext',
  code:'Stripe webhook → payment microservice → restaurant runtime',
  d:'Stripe does NOT call ORDELO directly. The success event is relayed through the restaurant runtime.',
  src:[['restaurant-agents/.../on_message_graph_handler.py','203']]},

 {f:'rest',t:'ordelo',l:'POST /payment-hooks/payment-complete',layer:'proxy',
  code:'POST {ORDELO}/payment-hooks/payment-complete\n\n{ data: { object: { metadata: { orderID } } } }   ← only field read',
  d:'Sets food_order.payment_status = requires_capture, then fans out two background tasks.',
  src:[['watomation/routers/payment_hooks.py','105']]},

 {f:'ordelo',t:'rest',l:'notify restaurant of payment',layer:'proxy',
  code:'POST {REST_APP_URL}/order-event-hooks/{rest_ref}/payment-complete/{recipient}/{thread_id}',
  d:'One of 11 webhook types ORDELO calls back on the restaurant app (config/params.py:66-78).',
  src:[['watomation/routers/payment_hooks.py','38'],['config/params.py','66']]},

 {f:'ordelo',t:'ext',l:'RPC init_delivery → delivery_summary',layer:'db',
  code:'RPC init_delivery(p_cust_id, p_order_number, p_rest_ref)\n\n→ delivery_summary  status = restaurant_unconfirmed\n                   restaurant_confirmation_status = restaurant_unconfirmed',
  d:'Branches on food_order.action: delivery → init_delivery, takeaway → init_takeaway. The insert fires a DB trigger that re-enters ORDELO — see the Delivery lifecycle view.',
  src:[['watomation/routers/payment_hooks.py','80'],['ordelo_datamodels/jobs_n_functions/init_delivery.sql','124']],
  g:'init_delivery RAISES if p_cust_id is not already in customer_master, and delivery_summary.customer_lon/lat are NOT NULL — so a customer with no geocoded address cannot have a delivery created.'},

 {f:'browser',t:'browser',l:'✗ no confirmation page',layer:'dead',
  code:'// TODO: Redirect to order confirmation page',
  d:'DEAD END. After paying, the customer is shown nothing. There is no order-status page and no polling against ORDELO anywhere in the frontend.',
  src:[['restaurant-frontend/app/order-summary/page.tsx','132']],
  g:'config/whatsapp.ts defines a PAYMENT_COMPLETE wa.me link per restaurant — but getWhatsAppUrl() is called in exactly one file and only for ADDRESS_UPDATE_COMPLETE and START_NEW_CONVERSATION. PAYMENT_COMPLETE is dead config. For a web-only channel this gap is the interesting part.'}
]},

session: { title:'Session &amp; Address', blurb:
  'How a customer is identified, and the one place the web flow legitimately hands back to WhatsApp. The customer session is the pair <code>(recipient, thread_id)</code> — minted by ORDELO, carried in the URL, never signed.',
  hops:[
 {f:'browser',t:'next',l:'page load → GET /api/verify-session',layer:'http',
  code:'/restaurant/elas?recipient=447448440754&thread_id=ELAS-7d4a…',
  d:'Params consumed: distance, minimum_order, order_type, rating, reviews, opensAt, recipient, thread_id.',
  src:[['restaurant-frontend/app/restaurant/[id]/page.tsx','52']]},

 {f:'next',t:'ordelo',l:'GET /order-hooks/get-active-thread',layer:'http',
  code:'→ { thread_id }  |  -1',
  d:'ORDELO proxies this to the restaurant runtime; see the Order flow, hop 6.',
  src:[['restaurant-frontend/app/api/verify-session/route.ts','20'],['watomation/routers/order_hooks.py','393']]},

 {f:'next',t:'browser',l:'valid? → render menu',layer:'http',
  code:'data.thread_id !== -1 && data.thread_id === threadId',
  d:'Re-run verbatim in BasketDrawer immediately before checkout. A non-OK response is treated as expired.',
  src:[['restaurant-frontend/app/restaurant/[id]/page.tsx','59'],['restaurant-frontend/components/BasketDrawer.tsx','87']],
  g:'Expiry lives in the DB, not the frontend: restaurant_master.rest_stale_active_threads_minutes. The frontend only ever sees the -1 sentinel.'},

 {f:'browser',t:'browser',l:'invalid → /address-update',layer:'dead',
  code:'router.push("/address-update?session_expired=true&rest_ref=" + restRef)',
  d:'The only route where rest_ref appears as a query param.',
  src:[['restaurant-frontend/app/restaurant/[id]/page.tsx','66']]},

/* ============================================================
   RENDER
   ============================================================ */
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const SVGNS = 'http://www.w3.org/2000/svg';
const el = (n,a={}) => { const e=document.createElementNS(SVGNS,n); for(const k in a) e.setAttribute(k,a[k]); return e; };

let state = { tab:'flows', flow:'order', off:new Set(), sel:null, fgroup:'all', fstatus:'all', q:'' };

const srcHtml = arr => (arr||[]).map(([f,l]) =>
  `<span class="src"><b>${esc(f)}</b>${l && l!=='1' ? ':'+esc(l) : ''}</span>`).join('');

/* ---------- SVG sequence diagram ---------- */
const LANE_W = 218, HEAD_H = 66, ROW_H = 54, PAD = 26;
const laneX = i => PAD + LANE_W/2 + i*LANE_W;

function drawFlow(){
  const flow = FLOWS[state.flow];
  const hops = flow.hops;
  const W = PAD*2 + LANE_W*5;
  const H = HEAD_H + hops.length*ROW_H + 40;
  const svg = $('#diagram');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const root = $('#svg-root');
  root.innerHTML = '';

  // lifelines + actor headers
  Object.entries(ACTORS).forEach(([key,a]) => {
    const x = laneX(a.x);
    root.appendChild(el('line',{x1:x,y1:HEAD_H-6,x2:x,y2:H-16,stroke:'#334155','stroke-width':1.5,'stroke-dasharray':'3 4'}));
    const box = el('rect',{x:x-92,y:14,width:184,height:40,rx:6,fill:'#1e293b',stroke:a.color,'stroke-width':1.5});
    root.appendChild(box);
    const t1 = el('text',{x,y:31,'text-anchor':'middle',fill:a.color,'font-size':12.5,'font-weight':700});
    t1.textContent = a.label; root.appendChild(t1);
    const t2 = el('text',{x,y:45,'text-anchor':'middle',fill:'#64748b','font-size':9.5});
    t2.textContent = a.sub; root.appendChild(t2);
  });

  // hops
  hops.forEach((h,i) => {
    const y = HEAD_H + 22 + i*ROW_H;
    const col = LAYERS[h.layer].color;
    const dim = state.off.has(h.layer);
    const g = el('g',{class:'hop'+(state.sel===i?' sel':''), opacity: dim?0.16:1});
    g.dataset.i = i;

    const hb = el('rect',{class:'hitbox',x:2,y:y-24,width:W-4,height:ROW_H-4,rx:4,fill:'transparent'});
    g.appendChild(hb);

    const x1 = laneX(ACTORS[h.f].x), x2 = laneX(ACTORS[h.t].x);
    const num = el('text',{x:PAD-12,y:y+4,'text-anchor':'middle',fill:'#475569','font-size':10});
    num.textContent = i+1; g.appendChild(num);

    if (h.f === h.t) {                       // self-hop
      const w = 96;
      const p = el('path',{d:`M ${x1} ${y-9} h ${w} v 18 h -${w}`,fill:'none',stroke:col,'stroke-width':1.8,
                           'stroke-dasharray': h.layer==='dead'?'5 4':''});
      g.appendChild(p);
      g.appendChild(el('path',{d:`M ${x1+7} ${y+5} L ${x1} ${y+9} L ${x1+7} ${y+13}`,fill:'none',stroke:col,'stroke-width':1.8}));
      const lb = el('text',{x:x1+w+10,y:y+4,fill:col,'font-size':11.5,'font-weight':600});
      lb.textContent = h.l; g.appendChild(lb);
    } else {
      const dir = x2 > x1 ? 1 : -1;
      const ax1 = x1 + dir*4, ax2 = x2 - dir*9;
      g.appendChild(el('line',{x1:ax1,y1:y,x2:ax2,y2:y,stroke:col,'stroke-width':1.8,
                               'stroke-dasharray': (h.layer==='db'||h.layer==='dead')?'5 4':''}));
      g.appendChild(el('path',{d:`M ${ax2-dir*7} ${y-4.5} L ${ax2+dir*2} ${y} L ${ax2-dir*7} ${y+4.5} Z`,fill:col}));
      const mid = (ax1+ax2)/2;
      const lb = el('text',{x:mid,y:y-8,'text-anchor':'middle',fill:col,'font-size':11.5,'font-weight':600});
      lb.textContent = h.l; g.appendChild(lb);
    }
    if (h.g) {
      const w = el('text',{x:W-PAD+6,y:y+4,'text-anchor':'end',fill:'#fb923c','font-size':12});
      w.textContent = '⚠'; g.appendChild(w);
    }
    g.addEventListener('click', () => selectHop(i));
    root.appendChild(g);
  });
  resetView();
}

function selectHop(i){
  state.sel = i;
  const h = FLOWS[state.flow].hops[i];
  $$('#svg-root .hop').forEach(g => g.classList.toggle('sel', +g.dataset.i === i));
  const d = $('#detail');
  d.classList.add('open');
  $('#det-title').textContent = h.l;
  $('#det-sub').textContent = `${ACTORS[h.f].label}  →  ${ACTORS[h.t].label}`;
  $('#det-body').innerHTML =
    `<span class="badge" style="background:${LAYERS[h.layer].color}22;color:${LAYERS[h.layer].color};border:1px solid ${LAYERS[h.layer].color}55">${esc(LAYERS[h.layer].label)}</span>` +
    (h.code ? `<div class="ds"><div class="dst">Wire</div><code class="dsc">${esc(h.code)}</code></div>` : '') +
    `<div class="ds"><div class="dst">What happens</div><div class="dsp">${esc(h.d)}</div></div>` +
    (h.g ? `<div class="ds"><div class="dst">Gotcha</div><div class="dsg">${esc(h.g)}</div></div>` : '') +
    (h.src ? `<div class="ds"><div class="dst">Source</div>${srcHtml(h.src)}</div>` : '');
  $('#prompt-text').textContent =
    `[${state.flow} · hop ${i+1}] ${ACTORS[h.f].label} → ${ACTORS[h.t].label}: ${h.l}\n` +
    (h.code ? h.code + '\n' : '') + h.d + (h.g ? '\nGOTCHA: ' + h.g : '') +
    (h.src ? '\n' + h.src.map(([f,l]) => l && l!=='1' ? `${f}:${l}` : f).join('  ') : '');
}

/* ---------- pan + zoom ---------- */
let vb = null, drag = null;
function resetView(){
  const s = $('#diagram').getAttribute('viewBox').split(' ').map(Number);
  vb = {x:s[0], y:s[1], w:s[2], h:s[3]}; applyVB();
}
function applyVB(){ $('#diagram').setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`); }
function zoom(f){ const cx=vb.x+vb.w/2, cy=vb.y+vb.h/2; vb.w*=f; vb.h*=f; vb.x=cx-vb.w/2; vb.y=cy-vb.h/2; applyVB(); }

/* ---------- sidebar ---------- */
function drawSidebar(){
  const c = $('#sidebar-content');
  if (state.tab === 'flows'){
    const flow = FLOWS[state.flow];
    c.innerHTML =
      `<div><div class="sec-title">Flow</div>` +
      Object.entries(FLOWS).map(([k,f]) =>
        `<div class="subview${k===state.flow?' active':''}" data-flow="${k}">${f.title}</div>`).join('') + `</div>` +
      `<div><div class="sec-title">Layers</div>` +
      Object.entries(LAYERS).map(([k,l]) =>
        `<div class="layer-row${state.off.has(k)?' off':''}" data-layer="${k}">` +
        `<span class="layer-dot" style="background:${l.color}"></span><span>${l.label}</span></div>`).join('') + `</div>` +
      (flow.hops.some(h=>h.g) ? `<div><div class="sec-title">Gotchas</div>` +
        flow.hops.map((h,i) => h.g ? `<div class="gotcha" data-hop="${i}"><div class="gtitle">${esc(h.l)}</div>` +
        `<div class="gdesc">${esc(h.g.length>120 ? h.g.slice(0,120)+'…' : h.g)}</div></div>` : '').join('') + `</div>` : '');
    c.querySelectorAll('[data-flow]').forEach(n => n.onclick = () => {
      state.flow = n.dataset.flow; state.sel = null; $('#detail').classList.remove('open');
      $('#prompt-text').textContent = FLOWS[state.flow].title.replace(/&amp;/g,'&') + ' — click any hop for its payload and source lines.';
      drawSidebar(); drawFlow();
    });
    c.querySelectorAll('[data-layer]').forEach(n => n.onclick = () => {
      const k = n.dataset.layer;
      state.off.has(k) ? state.off.delete(k) : state.off.add(k);
      drawSidebar(); drawFlow();
    });
    c.querySelectorAll('[data-hop]').forEach(n => n.onclick = () => selectHop(+n.dataset.hop));
  } else if (state.tab === 'endpoints'){
    const counts = {};
    ENDPOINTS.forEach(e => counts[e.g] = (counts[e.g]||0)+1);
    c.innerHTML = `<div><div class="sec-title">Direction</div>` +
      `<div class="subview${state.fgroup==='all'?' active':''}" data-g="all">All (${ENDPOINTS.length})</div>` +
      Object.entries(GROUPS).map(([k,g]) =>
        `<div class="subview${state.fgroup===k?' active':''}" data-g="${k}">${g.label} (${counts[k]||0})</div>`).join('') +
      `</div><div><div class="sec-title">Status</div>` +
      ['all','live','stale','dead'].map(s =>
        `<div class="subview${state.fstatus===s?' active':''}" data-s="${s}">${s}</div>`).join('') + `</div>`;
    c.querySelectorAll('[data-g]').forEach(n => n.onclick = () => { state.fgroup = n.dataset.g; drawSidebar(); drawPane(); });
    c.querySelectorAll('[data-s]').forEach(n => n.onclick = () => { state.fstatus = n.dataset.s; drawSidebar(); drawPane(); });
  } else if (state.tab === 'portals'){
    c.innerHTML = `<div><div class="sec-title">Portal</div>` +
      PORTALS.map(p => `<div class="subview" data-p="${p.id}">${p.name}</div>`).join('') + `</div>` +
      `<div class="note" style="font-size:11px;margin:0">Only <b>customer</b> and <b>sys-admin</b> talk to ORDELO. rest-admin and rider read Postgres directly.</div>`;
    c.querySelectorAll('[data-p]').forEach(n => n.onclick = () =>
      document.getElementById('portal-'+n.dataset.p)?.scrollIntoView({behavior:'smooth',block:'start'}));
  } else {
    c.innerHTML = `<div class="note" style="font-size:11px;margin:0">Every claim on this page cites <code>file:line</code> from the <code>dev</code> branch of OrdeloAgent, restaurant-frontend and restaurant-agents.</div>`;
  }
}

/* ---------- pane (non-diagram tabs) ---------- */
function drawPane(){
  const p = $('#pane');
  if (state.tab === 'endpoints'){
    const q = state.q.toLowerCase();
    const rows = ENDPOINTS.filter(e =>
      (state.fgroup==='all' || e.g===state.fgroup) &&
      (state.fstatus==='all' || e.s===state.fstatus) &&

    p.innerHTML =
      `<h2>Endpoint catalogue</h2>` +

      `<div id="filters">` +
      `<input id="search" placeholder="filter by path, file or description…" value="${esc(state.q)}">` +

      `<button class="fbtn${state.fstatus==='stale'?' active':''}" data-s="stale">stale doc</button>` +
      `<button class="fbtn${state.fstatus==='dead'?' active':''}" data-s="dead">dead</button></div>` +
      (rows.length===0 ? `<p class="lead">No endpoints match.</p>` :
      Object.entries(byGroup).map(([g,list]) =>
        `<h3>${GROUPS[g].label} <span style="color:#64748b;font-weight:400;font-size:11px">${list.length}</span></h3>` +
        `<p class="lead" style="margin-bottom:9px">${GROUPS[g].note}</p>` +
        list.map(e => `
          <div class="ep">
            <div class="ep-head">
              <span class="meth m-${e.m}">${e.m}</span>

            </div>
            <div class="ep-body">
              <dl class="ep-grid">
                <dt>Does</dt><dd>${esc(e.d)}</dd>

    const s = $('#search');

      const n = $('#search'); n.focus(); n.setSelectionRange(pos,pos); };

  } else if (state.tab === 'portals'){
    p.innerHTML = `<h2>The four portals</h2>` +
      `<p class="lead">restaurant-frontend hosts four separate applications. The headline finding is an <b>asymmetry</b>: only the customer and sys-admin portals call ORDELO. The rest-admin and rider portals read Postgres directly and never touch it — their only ORDELO coupling is the magic link that lets them in.</p>` +
      PORTALS.map(o => `
        <div id="portal-${o.id}" class="card ${o.tone}">
          <h4>${o.name}</h4>
          <p style="color:#f1f5f9">${esc(o.headline)}</p>
          <dl class="ep-grid" style="margin-top:10px">

            <dt>Calls</dt><dd>${o.calls.map(([m,path,to]) =>
              `<div style="margin-bottom:4px"><span class="meth m-${m.split('/')[0]}" style="margin-right:6px">${m}</span>` +
              `<code style="font-size:11px;color:#e2e8f0">${esc(path)}</code> ` +
              `<span style="color:#64748b;font-size:10.5px">${esc(to)}</span></div>`).join('')}</dd>
            <dt>Gotcha</dt><dd><div class="dsg">${esc(o.gotcha)}</div></dd>
          </dl>
        </div>`).join('');

  } else if (state.tab === 'data'){
    p.innerHTML = `<h2>Identity &amp; data</h2>` +
      `<p class="lead">One chain runs through the whole system, and it starts at a phone number. Every downstream key is derived from it. This is the single most important thing to understand before designing a web-only channel.</p>` +
      `<div class="note"><b>The chain:</b> <code>recipient</code> (phone) → <code>cust_id</code> (the same phone, VARCHAR(12)) → <code>order_id</code> (hash of the phone’s last 4 digits + daily sequence) → <code>order_number</code> (<code>{REST_REF}-{order_id}</code>) → <code>rest_ref</code> (recovered by splitting the order number). A web user with no phone number breaks this at step one.</div>` +
      IDENTITY.map(i => `

      `<p class="lead">The frontend reads several of these directly with the Supabase <b>secret key</b>, which bypasses RLS — so tenant isolation is enforced in JavaScript by the Proxy wrappers in <code>lib/rest-admin-session.ts</code> and <code>lib/rider-session.ts</code>, not by the database.</p>` +

       'delivery_dispatch — read directly by the rider and sys-admin portals; written by pg_cron and the WhatsApp callback.',
       'auth_sessions — magic-link sessions. ORDELO mints (storing only the SHA-256 hash); the frontend validates.',
       'v_admin_orders / v_admin_order_items / v_admin_orders_daily — views read only by the rest-admin portal.'
      ].map(t => `<div class="card"><p style="margin:0">${esc(t)}</p></div>`).join('') +
      `<h3>Verifying this page</h3>` +
      `<p class="lead">Every <code>file:line</code> here was checked against the working tree when this file was generated. To re-check after the code moves, extract each citation and assert the file exists and is long enough:</p>` +

while IFS=: read f l; do
  for r in ~/bloop/OrdeloAgent ~/bloop/restaurant-frontend ~/bloop/restaurant-agents; do
    [ -f "$r/$f" ] &amp;&amp; { [ "$(wc -l &lt; "$r/$f")" -ge "$l" ] || echo "SHORT $f:$l"; break; }
  done
done</code>`;

  } else if (state.tab === 'gaps'){
    const sec = (title, list, tone, intro) =>
      `<h3>${title}</h3><p class="lead">${intro}</p>` +
      list.map(g => `<div class="card ${tone}"><h4>${esc(g.t)}</h4><p>${esc(g.d)}</p>${srcHtml(g.src)}</div>`).join('');
    p.innerHTML = `<h2>What breaks in a website-only channel</h2>` +
      `<p class="lead">Descriptive only — this marks where the current flow <i>requires</i> WhatsApp to advance. It does not propose replacements.</p>` +
      `<div class="note"><b>The short version:</b> the customer-facing path is already channel-agnostic HTTP — <code>order_hooks</code>, <code>customer_hooks</code>, <code>payment_hooks</code>, pricing, Stripe and maps have no WhatsApp in them at all. The WhatsApp locks are on the <b>supply</b> side (restaurant confirms, rider accepts), not the customer side. But one hard blocker sits squarely in the customer path anyway: identity is a phone number, structurally.</div>` +
      sec('\u{1F534} Hard blockers — the code raises', GAPS.hard, 'red',
        'These are not conventions. Each one throws or violates a NOT NULL constraint for a customer without a phone number.') +
      sec('\u{1F7E0} Supply-side WhatsApp locks', GAPS.supply, 'amber',
        'Mostly orthogonal to a web customer channel — riders and restaurants can stay on WhatsApp. They matter only if the goal is a fully channel-agnostic core.') +
      sec('\u{1F535} Nuances that stop this over-claiming', GAPS.nuance, '',
        'The coupling is genuinely weaker than a first read suggests. Each of these cuts against the "it is all WhatsApp" conclusion.') +
      sec('\u{1F7E2} Already channel-agnostic', GAPS.reusable, 'green',
        'Reusable as-is by a web-only channel, with no changes.');
  }
}

/* ---------- tabs ---------- */

  state.tab = t;
  $$('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === t));
  const isFlow = t === 'flows';
  $('#diagram').style.display   = isFlow ? 'block' : 'none';

  else { drawPane(); $('#pane').scrollTop = 0;
         $('#prompt-text').textContent = { endpoints:'Endpoint catalogue — filter by direction or status, click a row to expand.',
           portals:'Four portals. Only customer and sys-admin call ORDELO.',
           data:'The identity chain: recipient → cust_id → order_id → order_number → rest_ref.',
           gaps:'WhatsApp couplings, marked by severity.' }[t]; }
}

(() => {
  const svg = $('#diagram');
  svg.addEventListener('mousedown', e => { drag = {x:e.clientX, y:e.clientY, vx:vb.x, vy:vb.y}; svg.classList.add('panning'); });
  window.addEventListener('mousemove', e => {
    if (!drag) return;
    const r = svg.getBoundingClientRect();
    vb.x = drag.vx - (e.clientX - drag.x) * vb.w / r.width;
    vb.y = drag.vy - (e.clientY - drag.y) * vb.h / r.height;
    applyVB();
  });
  window.addEventListener('mouseup', () => { drag = null; svg.classList.remove('panning'); });
  svg.addEventListener('wheel', e => { e.preventDefault(); zoom(e.deltaY > 0 ? 1.1 : 1/1.1); }, {passive:false});
})();

setTab('flows');
</script>
</body>
</html>
