[project]
name = "ordelo-agent"
version = "0.1.0"
requires-python = "==3.13.11"
dependencies = [
    # Web framework
    "fastapi==0.128.0",
    "uvicorn==0.40.0",
    "gunicorn",
    "python-multipart",
    # Database
    "psycopg[binary]",
    "psycopg-pool",
    "supabase==2.27.1",
    # LangChain / LLM
    "langchain==1.2.15",
    "langchain-openai==1.1.14",
    "langchain-google-genai==4.1.3",
    "langgraph==1.1.5",
    "langgraph-checkpoint-postgres==3.0.5",
    # WhatsApp
    "pywa==3.6.1",
    # Auth
    "msal",
    # Pydantic
    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.1",
    "pydantic-core",
    # Utilities
    "jinja2",
    "python-dotenv",
    "typing_extensions>=4.8.0",
    "boto3",
    "twilio",
    "loguru",
    "requests",
    "httpx",
    "annotated-types",
    "tzdata",
]


[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.12.0",
    "respx>=0.21.0",
    "freezegun>=1.4.0",
    "ipykernel",
    "ipython",
    "mermaid-python",
    "duckdb==1.4.3",
    "pandas==2.2.3",
    "gspread",
    "pyarrow==19.0.0",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ordelo", "ordelo_datamodels", "watomation", "utils_common", "utils", "config"]

[tool.basedpyright]
venv = '.venv'
typeCheckingMode = "off"

[tool.ruff]
lint.select = ["F"]
lint.ignore = ["F704"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
]
